<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>모아두기 — 지금 발견하고, 나중에 실행</title>
  <link rel="icon" href="./assets/favicon.ico?v=1.2.0" sizes="any">
  <link rel="icon" href="./assets/moadoogi-logo.svg?v=1.2.0" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=1.2.0">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./improvements.css">
  <link rel="stylesheet" href="./composer.css">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./cloud.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img class="brand-icon" src="./assets/moadoogi-logo.svg" width="38" height="38" alt=""><div><strong>모아두기<span class="dot">.</span></strong><small>SAVE NOW · DO LATER</small></div></div>
      <div class="nav-title">WORKSPACE</div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button data-filter="전체"><span class="nav-icon nav-all">▦</span>전체 보기 <span class="nav-count" data-count="전체"></span></button>
        <button data-filter="관심" class="active"><span class="nav-icon nav-interest">☆</span>관심 <span class="nav-count" data-count="관심"></span></button>
        <button data-filter="진행중"><span class="nav-icon nav-progress">◔</span>진행 중 <span class="nav-count" data-count="진행중"></span></button>
        <button data-filter="완료"><span class="nav-icon nav-done">✓</span>완료 <span class="nav-count" data-count="완료"></span></button>
        <button data-filter="미루기"><span class="nav-icon nav-snooze">◷</span>미루기 <span class="nav-count" data-count="미루기"></span></button>
        <button data-filter="포기"><span class="nav-icon nav-abandon">⊘</span>포기 <span class="nav-count" data-count="포기"></span></button>
      </nav>
      <div class="nav-title second-title">SHORTCUTS</div>
      <nav class="sidebar-nav"><button type="button" id="shopping-nav"><span class="nav-icon">▱</span>쇼핑</button><button id="dated-nav"><span class="nav-icon">▤</span>일정 캘린더</button></nav>
      <div class="side-spacer"></div>
      <div class="account"><span>나</span> 나만의 스크랩 공간 <small>⌄</small></div>
    </aside>
    <main class="main">
      <header class="topbar"><div>내 작업 공간 <span class="slash">/</span> <strong id="page-breadcrumb">스크랩 & 할 일</strong></div><div class="top-right"><button type="button" id="theme-toggle" class="theme-toggle" aria-label="다크 모드로 전환" title="라이트 / 다크 모드"><span id="theme-icon" aria-hidden="true">☾</span></button><span class="today" id="today"></span></div></header>
      <div class="content">
        <div class="cloud-auth" aria-label="구글 로그인과 스크랩 동기화">
          <span id="cloud-status" class="cloud-status">로컬 저장 모드</span>
          <span id="cloud-user" class="cloud-user"></span>
          <button type="button" id="cloud-login" class="cloud-button" hidden>G 구글 로그인</button>
          <button type="button" id="cloud-import" class="cloud-button" hidden title="기존 로컬 스크랩을 내 계정에 추가">로컬 가져오기</button>
          <button type="button" id="cloud-refresh" class="cloud-button" hidden>↻ 동기화</button>
          <button type="button" id="cloud-logout" class="cloud-button" hidden>로그아웃</button>
          <button type="button" id="cloud-export" class="cloud-button" title="현재 스크랩을 JSON 파일로 백업">↓ 백업</button>
          <button type="button" id="cloud-import-file" class="cloud-button" title="JSON 백업에서 스크랩 불러오기">↑ 복원</button>
          <input type="file" id="cloud-file" accept=".json,application/json" hidden aria-label="모아두기 JSON 백업 파일">
        </div>
        <div class="intro"><div><h1>내 스크랩 & 할 일 <span>✦</span></h1></div></div>
        <section class="quick-capture" aria-label="스크랩 입력">
          <div class="composer-toolbar">
            <button type="button" class="star-button composer-star" id="capture-star" aria-label="중요 스크랩으로 표시" aria-pressed="false" title="중요한 스크랩 표시">☆</button>
            <button type="button" class="clipboard-btn" id="paste-clipboard" aria-label="클립보드에서 붙여넣기" title="클립보드 붙여넣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M5 16H4a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h10a1 1 0 0 1 1 1v1"/></svg></button>
          </div>
          <label for="capture-input" class="sr-only">링크 또는 게시글 내용을 붙여넣으세요</label>
          <textarea id="capture-input" rows="5" placeholder="복사한 링크나 글, 나중에 할 일을 입력하세요"></textarea>
          <div class="composer-meta">
            <time id="capture-timestamp"></time>
            <div class="composer-footer">
              <div class="tag-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 13 12 21a2 2 0 0 1-2.8 0L3 14.8V4a1 1 0 0 1 1-1h10.8L20 8.2a3.4 3.4 0 0 1 0 4.8Z"/><circle cx="8.2" cy="8.2" r="1.3"/></svg>
                <div id="tag-chips" class="tag-chips"></div>
                <input id="tag-input" type="text" autocomplete="off" aria-label="태그 입력, 스페이스로 구분" placeholder="태그 입력 (스페이스로 구분)">
              </div>
              <button type="button" class="primary" id="capture-save" disabled>스크랩</button>
            </div>
          </div>
          <p class="capture-helper">아카라이브처럼 제목 조회를 차단하는 사이트는 <a id="page-bookmarklet" href="#" title="이 링크를 브라우저 북마크바에 끌어다 놓으세요">✳ 모아두기 스크랩</a>을 북마크바로 끌어다 놓은 뒤, 게시글에서 눌러 주세요.</p>
        </section>
        <section class="stats"><button type="button" class="stat featured stat-button" id="interest-stat"><span>☆ 관심</span><strong id="interest">0</strong><div class="sparkle">✦</div></button><button type="button" class="stat stat-button" id="progress-stat"><span>◔ 진행 중</span><strong id="progress">0</strong><div class="stat-icon">◔</div></button><button type="button" class="stat stat-button" id="dated-stat"><span>▤ 일정이 있는 항목</span><strong id="dated">0</strong><span id="urgent-count" class="urgent-count" hidden></span><div class="stat-icon">▤</div></button></section>
        <section id="calendar-page" class="calendar-page" aria-label="일정 캘린더" hidden></section>
        <div class="section-title"><div><h2><span id="list-heading">내 스크랩 목록</span> <small id="visible-count">0개</small></h2><div id="tag-filter-banner" class="tag-filter-banner" hidden><span id="tag-filter-label"></span><button type="button" id="tag-filter-clear" aria-label="태그 필터 해제">× 필터 해제</button></div></div></div>
        <div class="filters"><div class="pills" id="pills"></div><div class="filter-right"><label class="search">⌕ <input id="search" type="search" placeholder="제목, 내용, 태그 검색"></label><select id="sort" aria-label="정렬"><option value="manual">우선순위순 ↕</option><option value="recent">최근 저장순 ↓</option><option value="old">오래된 순</option><option value="date">일정 빠른 순</option><option value="title">제목 가나다순</option></select></div></div>
        <div class="workspace"><div class="cards" id="cards"></div><aside class="detail" id="detail"></aside></div>
      </div>
    </main>
  </div>
  <nav class="bottomnav" id="bottom-nav"><button data-filter="전체"><span>▦</span>전체</button><button data-filter="관심" class="active"><span>☆</span>관심</button><button data-filter="진행중"><span>◔</span>진행</button><button data-filter="완료"><span>✓</span>완료</button><button type="button" id="calendar-bottom-nav"><span>▤</span>캘린더</button></nav>
  <div class="modal-backdrop" id="modal-backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-top"><div><h2 id="modal-title">새 발견 저장하기</h2><p>주소나 텍스트를 붙여넣어 저장할 수 있어요.</p></div><button class="close" id="modal-close" aria-label="닫기">×</button></div>
      <form id="item-form"><label class="field"><span>제목 *</span><input id="f-title" placeholder="예: 퇴근 후 읽을 좋은 글" maxlength="180" required></label><label class="field"><span>주소 (선택)</span><input type="url" id="f-url" placeholder="https://..."></label><label class="field"><span>내용 / 메모</span><textarea id="f-note" rows="4" placeholder="읽고 싶은 내용, 나중에 해야 할 일 등을 적어주세요."></textarea></label><div class="field"><span>태그 (스페이스로 구분)</span><div class="edit-tag-field"><div class="tag-chips" id="edit-tag-chips"></div><input id="f-tags" autocomplete="off" placeholder="태그 입력 후 스페이스"></div></div><div class="field-grid"><label class="field"><span>상태</span><select id="f-status"><option>관심</option><option>진행중</option><option>완료</option><option>미루기</option><option>포기</option></select></label><label class="field"><span>관련 날짜</span><input type="date" id="f-date"></label></div><label class="edit-star-field"><input id="f-starred" type="checkbox"><span class="edit-star-icon" aria-hidden="true">★</span> 중요 스크랩으로 표시 (우선순위 맨 위)</label><p class="hint">사이트 제목은 제목 읽기 서비스를 실행했을 때 자동으로 가져옵니다.</p><div class="modal-actions"><button type="button" class="subtle" id="example">공유 예시 넣기</button><button class="primary" type="submit">저장하기</button></div></form>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="./cloud-config.js" defer></script>
  <script src="./cloud-client.js" defer></script>
  <script src="./favicons.js" defer></script>
  <script src="./calendar.js" defer></script>
  <script src="./bilibili.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
