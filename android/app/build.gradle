plugins { id 'com.android.application' }

android {
    namespace 'io.github.flowergorge.moadoogi'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.flowergorge.moadoogi'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
